name: employee_mgmt
description: Employee Management Application with SDUI, BLoC, Clean Architecture

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Components
  digit_ui_components: ^0.3.0+2

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # DI
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Network
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Local Storage / Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Navigation
  go_router: ^13.0.0

  # Utils
  intl: 0.20.2
  logger: ^2.0.2+1
  dartz: ^0.10.1

dependency_overrides:
  intl: 0.20.2
  fluttertoast: ^8.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sdui/
